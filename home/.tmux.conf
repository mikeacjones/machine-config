# --- mouse / click-to-focus ---
# Mouse on: wheel scrolls tmux history. Hold Shift to bypass tmux and get Ghostty (native
# selection, click positioning). Set to `off` to pass clicks through, at the cost of
# scroll-wheel scrolling inside tmux.
set -g mouse on

# --- quality-of-life (cheap, no startup cost) ---
set -sg escape-time 0            # no delay after pressing Esc (matters for vim)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # truecolor passthrough
set -g base-index 1              # windows start at 1
setw -g pane-base-index 1        # panes start at 1

# --- Claude Code (and other modern TUIs) ---
set -s extended-keys on                          # pass Shift+Enter etc. through, so it inserts a newline
set -as terminal-features 'xterm*:extkeys'       # tell tmux the outer terminal (Ghostty) supports them
# let desktop-notification/OSC escapes reach the terminal; `all` also forwards them from panes
# that are not on screen, so a Claude in a background window can still say it needs you
set -g allow-passthrough all
# copy the attaching terminal's TERM_PROGRAM into the session, so ~/.claude/hooks/warp-tmux-bridge.sh
# only sends Warp's agent events when Warp (not Ghostty) is the terminal attached
set -ga update-environment TERM_PROGRAM
set -g focus-events on                           # apps see focus in/out of the pane

# --- open new windows/panes in the CURRENT pane's directory ---
# Default is the dir the tmux server started in; #{pane_current_path} inherits
# the cwd of the pane you're in when you hit the key.
bind c new-window   -c "#{pane_current_path}"   # prefix c  : new window
bind '"' split-window   -c "#{pane_current_path}"   # prefix "  : horizontal split
bind %   split-window -h -c "#{pane_current_path}"  # prefix %  : vertical split
